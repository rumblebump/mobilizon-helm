name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_UNITTEST_VERSION: v1.1.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for f in charts/mobilizon/ci/*-values.yaml; do
            helm lint --strict charts/mobilizon -f "$f"
            helm template test charts/mobilizon -f "$f" > /dev/null
          done

  unittest:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          # Helm 4 wants --verify=false for unsigned plugins; Helm 3 has no such flag.
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false \
            || helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION"
          helm unittest charts/mobilizon

  release:
    needs: unittest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          # main always publishes 0.0.0-dev (overwritten each push); a tag vX.Y.Z publishes X.Y.Z.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] \
              || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z SemVer"; exit 1; }
          else
            version=0.0.0-dev
          fi
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/mobilizon --version "$version" -d dist
          helm push "dist/mobilizon-$version.tgz" "$registry"
