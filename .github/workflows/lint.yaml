name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for f in charts/mobilizon/ci/*-values.yaml; do
            helm lint --strict charts/mobilizon -f "$f"
            helm template test charts/mobilizon -f "$f" > /dev/null
          done
