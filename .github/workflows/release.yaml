name: release

on:
  push:
    branches: [main]
    paths: [charts/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  # Not versioned yet: every push to main overwrites this tag.
  CHART_VERSION: 0.0.0-dev

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/mobilizon --version "$CHART_VERSION" -d dist
          helm push "dist/mobilizon-$CHART_VERSION.tgz" "$registry"
