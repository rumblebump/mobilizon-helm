{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mobilizon.fullname" . }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.mobilizon.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.mobilizon.host | quote }}
      http:
        paths:
          {{- with include "mobilizon.dex.path" . }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "mobilizon.dex.fullname" $ }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mobilizon.fullname" . }}
                port:
                  name: http
{{- end }}
