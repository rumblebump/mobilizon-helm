{{- $caCerts := or .Values.extraCACerts.configMap .Values.extraCACerts.secret }}
{{- if and .Values.extraCACerts.configMap .Values.extraCACerts.secret }}
{{- fail "set extraCACerts.configMap or extraCACerts.secret, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mobilizon.fullname" . }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  # Uploads live on a ReadWriteOnce volume, so run one pod and replace it on upgrade.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mobilizon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "mobilizon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- $annotations := deepCopy .Values.podAnnotations }}
      {{- if include "mobilizon.oidc.enabled" . }}
      {{- $_ := set $annotations "checksum/config-exs" (include "mobilizon.configExs" . | sha256sum) }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # The image runs as nobody.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.persistence.enabled $caCerts }}
      initContainers:
        {{- if .Values.persistence.enabled }}
        # A fresh volume hides the export directories baked into the image.
        - name: init-uploads
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["mkdir", "-p", "/var/lib/mobilizon/uploads/exports/csv", "/var/lib/mobilizon/uploads/exports/pdf", "/var/lib/mobilizon/uploads/exports/ods"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with .Values.initUploads.resources | default .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/mobilizon/uploads
        {{- end }}
        {{- if $caCerts }}
        # The image's trust store plus extraCACerts, rebuilt on every start so image upgrades
        # keep their public CAs.
        - name: init-ca-certs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              cat /etc/ssl/certs/ca-certificates.crt > /trust/ca-certificates.crt
              for f in /extra-ca-certs/*; do echo; cat "$f"; done >> /trust/ca-certificates.crt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with .Values.initUploads.resources | default .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: trust
              mountPath: /trust
            - name: extra-ca-certs
              mountPath: /extra-ca-certs
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: mobilizon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MOBILIZON_INSTANCE_HOST
              value: {{ required "mobilizon.host is required (the public hostname, fixed after the first start)" .Values.mobilizon.host | quote }}
            - name: MOBILIZON_INSTANCE_NAME
              value: {{ .Values.mobilizon.name | quote }}
            - name: MOBILIZON_INSTANCE_DESCRIPTION
              value: {{ .Values.mobilizon.description | quote }}
            - name: MOBILIZON_INSTANCE_EMAIL
              value: {{ .Values.mobilizon.email | quote }}
            - name: MOBILIZON_REPLY_EMAIL
              value: {{ .Values.mobilizon.email | quote }}
            - name: MOBILIZON_INSTANCE_REGISTRATIONS_OPEN
              value: {{ .Values.mobilizon.registrationsOpen | quote }}
            - name: MOBILIZON_INSTANCE_SECRET_KEY_BASE
              {{- include "mobilizon.secretKeyRef" (list . .Values.mobilizon.existingSecret .Values.mobilizon.secretKeys.secretKeyBase "secret-key-base") | nindent 14 }}
            - name: MOBILIZON_INSTANCE_SECRET_KEY
              {{- include "mobilizon.secretKeyRef" (list . .Values.mobilizon.existingSecret .Values.mobilizon.secretKeys.secretKey "secret-key") | nindent 14 }}
            {{- include "mobilizon.database.env" . | nindent 12 }}
            {{- with .Values.smtp }}
            {{- if .enabled }}
            - name: MOBILIZON_SMTP_SERVER
              value: {{ required "smtp.host is required when smtp.enabled=true" .host | quote }}
            - name: MOBILIZON_SMTP_PORT
              value: {{ .port | quote }}
            - name: MOBILIZON_SMTP_TLS
              value: {{ .tls | quote }}
            - name: MOBILIZON_SMTP_SSL
              value: {{ .ssl | quote }}
            - name: MOBILIZON_SMTP_AUTH
              value: {{ .auth | quote }}
            {{- if or .username (and .existingSecret .secretKeys.username) }}
            - name: MOBILIZON_SMTP_USERNAME
              {{- include "mobilizon.username" (list $ .) | nindent 14 }}
            {{- end }}
            {{- if or .existingSecret .password }}
            - name: MOBILIZON_SMTP_PASSWORD
              {{- include "mobilizon.secretKeyRef" (list $ .existingSecret .secretKeys.password "smtp-password") | nindent 14 }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if include "mobilizon.oidc.enabled" . }}
            - name: MOBILIZON_CONFIG_PATH
              value: /etc/mobilizon-chart/config.exs
            - name: MOBILIZON_OIDC_CLIENT_SECRET
              {{- include "mobilizon.oidc.clientSecret" . | nindent 14 }}
            {{- end }}
            {{- range $name, $value := .Values.mobilizon.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4000
          # The entrypoint waits for the database and runs migrations before listening.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled (include "mobilizon.oidc.enabled" .) $caCerts .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: uploads
              mountPath: /var/lib/mobilizon/uploads
            {{- end }}
            {{- if include "mobilizon.oidc.enabled" . }}
            - name: config
              mountPath: /etc/mobilizon-chart
              readOnly: true
            {{- end }}
            {{- if $caCerts }}
            - name: trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled (include "mobilizon.oidc.enabled" .) $caCerts .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "mobilizon.fullname" .) }}
        {{- end }}
        {{- if include "mobilizon.oidc.enabled" . }}
        - name: config
          configMap:
            name: {{ include "mobilizon.fullname" . }}-config
        {{- end }}
        {{- if $caCerts }}
        - name: trust
          emptyDir: {}
        - name: extra-ca-certs
          {{- if .Values.extraCACerts.configMap }}
          configMap:
            name: {{ .Values.extraCACerts.configMap }}
          {{- else }}
          secret:
            secretName: {{ .Values.extraCACerts.secret }}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
