{{- /* Only values given inline end up here; nothing is generated, so renders are stable under GitOps. */}}
{{- $instance := not .Values.mobilizon.existingSecret }}
{{- $database := not .Values.database.existingSecret }}
{{- $smtp := and .Values.smtp.enabled (not .Values.smtp.existingSecret) .Values.smtp.password }}
{{- if or $instance $database $smtp }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mobilizon.fullname" . }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $instance }}
  secret-key-base: {{ required "set mobilizon.existingSecret or mobilizon.secretKeyBase" .Values.mobilizon.secretKeyBase | b64enc }}
  secret-key: {{ required "set mobilizon.existingSecret or mobilizon.secretKey" .Values.mobilizon.secretKey | b64enc }}
  {{- end }}
  {{- if $database }}
  database-password: {{ required "set database.existingSecret or database.password" .Values.database.password | b64enc }}
  {{- end }}
  {{- if $smtp }}
  smtp-password: {{ .Values.smtp.password | b64enc }}
  {{- end }}
{{- end }}
