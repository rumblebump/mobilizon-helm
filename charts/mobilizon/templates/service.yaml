apiVersion: v1
kind: Service
metadata:
  name: {{ include "mobilizon.fullname" . }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "mobilizon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
