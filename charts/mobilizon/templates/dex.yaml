{{- if .Values.dex.enabled }}
{{- $fullname := include "mobilizon.dex.fullname" . }}
{{- $config := include "mobilizon.dex.config" . }}
{{- if not .Values.dex.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
type: Opaque
data:
  config.yaml: {{ $config | b64enc }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
spec:
  ports:
    - name: http
      port: 5556
      targetPort: http
  selector:
    {{- include "mobilizon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dex
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
spec:
  # Memory storage: a second replica would not share sessions.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mobilizon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dex
  template:
    metadata:
      labels:
        {{- include "mobilizon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dex
      {{- if not .Values.dex.existingSecret }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: "{{ .Values.dex.image.repository }}:{{ .Values.dex.image.tag }}"
          imagePullPolicy: {{ .Values.dex.image.pullPolicy }}
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DEX_CLIENT_SECRET
              {{- include "mobilizon.oidc.clientSecret" . | nindent 14 }}
          ports:
            - name: http
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: telemetry
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: telemetry
          {{- with .Values.dex.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.dex.existingSecret | default $fullname }}
            items:
              - key: config.yaml
                path: config.yaml
        - name: tmp
          emptyDir: {}
      {{- with .Values.dex.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dex.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dex.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
