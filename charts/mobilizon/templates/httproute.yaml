{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mobilizon.fullname" . }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs is required when httpRoute.enabled=true" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ .Values.mobilizon.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "mobilizon.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
