{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required when httpRoute.enabled=true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mobilizon.fullname" . }}
  labels:
    {{- include "mobilizon.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.mobilizon.host | quote }}
  rules:
    {{- with .Values.httpRoute.rules }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- else }}
    {{- with include "mobilizon.dex.path" . }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      backendRefs:
        - name: {{ include "mobilizon.dex.fullname" $ }}
          port: 5556
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "mobilizon.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- end }}
