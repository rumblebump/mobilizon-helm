image:
  repository: kaihuri/mobilizon
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

mobilizon:
  # Public hostname (required). Mobilizon always builds https://<host> URLs, so terminate TLS in
  # front of it. It is stored in the database on first start (actor URLs), so set it before the
  # first install; changing it later breaks federation and the internal relay actor.
  host: ""
  name: Mobilizon
  description: Change this to a proper description of your instance
  email: noreply@mobilizon.example.com
  registrationsOpen: false
  # Any other plain MOBILIZON_* variable read by the image's config.exs, for example:
  #   MOBILIZON_LOGLEVEL: info
  #   MOBILIZON_INSTANCE_DEFAULT_LANGUAGE: de
  env: {}
  # Existing Secret holding the instance keys (recommended). Otherwise set both keys below,
  # for example with `openssl rand -base64 48`. The chart never generates secrets.
  existingSecret: ""
  secretKeyBase: ""
  secretKey: ""
  secretKeys:
    secretKeyBase: secret-key-base
    secretKey: secret-key

# Connection used by Mobilizon. With postgresql.enabled the host is the bundled server.
database:
  host: ""
  port: 5432
  name: mobilizon
  username: mobilizon
  # Required unless existingSecret is set.
  password: ""
  ssl: false
  existingSecret: ""
  secretKeys:
    password: password
    # Set to read the username from existingSecret too (for example "username" for CloudNativePG).
    username: ""

# Bundled PostGIS server. Mobilizon requires the postgis extension, so plain postgres will not do.
# Disable it and set database.host to use an existing server or an operator such as CloudNativePG.
postgresql:
  enabled: true
  image:
    repository: postgis/postgis
    tag: 17-3.6-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 8Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Only rendered when enabled. Unset, Mobilizon defaults to localhost:25.
smtp:
  enabled: false
  host: ""
  port: 587
  # if_available, always or never
  tls: if_available
  ssl: false
  auth: if_available
  username: ""
  # Ignored when existingSecret is set.
  password: ""
  existingSecret: ""
  secretKeys:
    password: password
    # Set to read the username from existingSecret too.
    username: ""

# Uploaded pictures and exports.
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Secret with the certificate for mobilizon.host. No TLS block when empty.
  tlsSecretName: ""

# Gateway API HTTPRoute for mobilizon.host.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: my-gateway
  #    namespace: gateway-system
  #    sectionName: https
  # Replaces the default rule (all paths to the Mobilizon service) when set. Values are run
  # through tpl, so the service name can be written as {{ include "mobilizon.fullname" . }}.
  rules: []
  #  - matches:
  #      - path: {type: PathPrefix, value: /}
  #    backendRefs:
  #      - name: '{{ include "mobilizon.fullname" . }}'
  #        port: 80
  #    timeouts:
  #      request: 0s

# Optional Caddy in front of Mobilizon that terminates TLS with automatic Let's Encrypt
# certificates for mobilizon.host. Leave it off when an Ingress controller or Gateway already
# handles TLS. Caddy listens on 8080/8443 as a non-root user; its Service exposes 80/443.
caddy:
  enabled: false
  image:
    # Use a custom build (xcaddy) for plugins such as geoblocking or DNS providers.
    repository: caddy
    tag: 2.11.4-alpine
    pullPolicy: IfNotPresent
  # ACME account email (recommended).
  email: ""
  # Extra global options, for example `acme_ca https://acme-staging-v02.api.letsencrypt.org/directory`.
  globalOptions: ""
  # Extra directives inside the mobilizon.host site block, before reverse_proxy (run through tpl).
  siteConfig: ""
  # Additional site blocks appended to the Caddyfile (run through tpl).
  extraSites: ""
  # Replaces the whole generated Caddyfile (run through tpl). Keep http_port 8080 / https_port 8443.
  caddyfile: ""
  # ConfigMap with a `Caddyfile` key to use instead of the chart's.
  existingConfigMap: ""
  # For example DNS-provider API tokens from a Secret.
  extraEnv: []
  extraEnvFrom: []
  service:
    type: LoadBalancer
    annotations: {}
    loadBalancerIP: ""
    # Local keeps the client IP (useful for geoblocking).
    externalTrafficPolicy: Local
  # ACME account and certificates.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    existingClaim: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

extraEnv: []
extraEnvFrom: []

resources: {}
# Init container that creates the export directories on the uploads volume.
initUploads:
  # Defaults to resources above when empty.
  resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
