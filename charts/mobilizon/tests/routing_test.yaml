suite: ingress and httproute
templates:
  - ingress.yaml
  - httproute.yaml
release:
  name: test
set:
  mobilizon.host: events.example.org
tests:
  - it: renders neither by default
    asserts:
      - hasDocuments:
          count: 0

  - it: routes the host through an Ingress with TLS
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.tlsSecretName: events-tls
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: events.example.org
      - equal:
          path: spec.tls[0]
          value:
            hosts: [events.example.org]
            secretName: events-tls

  - it: leaves TLS out of the Ingress without a secret
    template: ingress.yaml
    set:
      ingress.enabled: true
    asserts:
      - notExists:
          path: spec.tls

  - it: routes the host through an HTTPRoute
    template: httproute.yaml
    set:
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: gateway
    asserts:
      - equal:
          path: spec.hostnames
          value: [events.example.org]
      - equal:
          path: spec.parentRefs[0].name
          value: gateway
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: test-mobilizon
            port: 80

