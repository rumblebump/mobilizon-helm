suite: secret
templates:
  - secret.yaml
release:
  name: test
tests:
  - it: is not rendered when every credential comes from an existing Secret
    set:
      mobilizon.existingSecret: mobilizon-keys
      database.existingSecret: mobilizon-db
    asserts:
      - hasDocuments:
          count: 0

  - it: stores inline credentials without generating anything
    set:
      mobilizon.secretKeyBase: kb
      mobilizon.secretKey: k
      database.password: pw
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data
          value:
            secret-key-base: a2I=
            secret-key: aw==
            database-password: cHc=

  - it: stores an inline SMTP password
    set:
      mobilizon.existingSecret: mobilizon-keys
      database.existingSecret: mobilizon-db
      smtp.enabled: true
      smtp.host: smtp.example.org
      smtp.password: s
    asserts:
      - equal:
          path: data
          value:
            smtp-password: cw==

  - it: fails when the instance keys are missing
    set:
      database.existingSecret: mobilizon-db
    asserts:
      - failedTemplate:
          errorMessage: set mobilizon.existingSecret or mobilizon.secretKeyBase

  - it: fails when the database password is missing
    set:
      mobilizon.existingSecret: mobilizon-keys
    asserts:
      - failedTemplate:
          errorMessage: set database.existingSecret or database.password
