apiVersion: v2
name: mobilizon
description: Minimal Helm chart for Mobilizon, the federated event and group platform
type: application
version: 0.0.5
appVersion: "5.2.4"
home: https://mobilizon.org
sources:
  - https://framagit.org/kaihuri/mobilizon
  - https://github.com/rumblebump/mobilizon-helm
keywords:
  - mobilizon
  - fediverse
  - activitypub
  - events
annotations:
  artifacthub.io/license: MIT
  # Keep in sync with appVersion and postgresql.image in values.yaml (used for security scanning).
  artifacthub.io/images: |
    - name: mobilizon
      image: ghcr.io/rumblebump/mobilizon-patched:5.2.4
    - name: postgis
      image: postgis/postgis:17-3.6-alpine
    - name: caddy
      image: caddy:2.11.4-alpine
    - name: dex
      image: ghcr.io/dexidp/dex:v2.45.1
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/rumblebump/mobilizon-helm
    - name: Mobilizon docs
      url: https://docs.mobilizon.org
